<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Counter</title>
</head>
<body>

  <div class="card">
    <h2>Simple Counter</h2>
    <div id="count" class="counter-value">0</div>
    <div class="btn-group">
      <button class="btn-decrement" id="decrementBtn">-</button>
      <button class="btn-reset" id="resetBtn">Reset</button>
      <button class="btn-increment" id="incrementBtn">+</button>
    </div>
  </div>

</body>
</html>
